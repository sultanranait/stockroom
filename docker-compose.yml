services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockroom']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
